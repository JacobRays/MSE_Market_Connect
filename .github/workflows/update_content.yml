name: Update Content (News + Prices)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"  # hourly

jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Update news from GDELT
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python tools/scraper/gdelt_news_scraper.py

  prices:
    # This will keep failing on GitHub-hosted runners due to 403 from mse.co.mw.
    # Leave it here only if you later switch this job to a self-hosted runner.
    runs-on: ubuntu-latest
    steps:
      - run: echo "Skipping prices on GitHub-hosted runner (mse.co.mw blocks datacenter IPs)"

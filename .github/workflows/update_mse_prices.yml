name: Update MSE Prices
on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 7-14 * * 1-5"
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r tools/scraper/requirements.txt
      - name: Update Stocks and News
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python tools/scraper/mse_mainboard_prices.py
          python tools/scraper/mse_announcements_scraper.py
